<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" role="img" aria-label="Magnet Harvester 架构：Mac 菜单栏代理、NAS 服务、qBittorrent 与网页端">
  <title>Magnet Harvester 架构</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8798"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b7cf6"/>
    </marker>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e6ebf5; }
      .m { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9aa6b8; }
      .box { fill: #141a25; stroke: #2c3550; stroke-width: 1.6; }
      .inner { fill: #10151f; stroke: #2a3348; stroke-width: 1.4; }
      .zone { fill: #0e1420; stroke: #3a4463; stroke-width: 1.6; stroke-dasharray: 7 6; }
      .link { fill: none; stroke: #7c8798; stroke-width: 2; marker-end: url(#arrow); }
      .link-a { fill: none; stroke: #8b7cf6; stroke-width: 2.2; marker-end: url(#arrow-accent); }
      .pill { fill: #18203300; stroke: #33405e; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#0b0f16"/>

  <!-- Mac 代理 -->
  <g>
    <rect class="box" x="36" y="54" width="252" height="176" rx="16"/>
    <text class="t" x="60" y="90" font-size="22" font-weight="700">macOS 菜单栏代理</text>
    <text class="m" x="60" y="120" font-size="18">剪贴板监听（1s）</text>
    <text class="m" x="60" y="146" font-size="18">只认 magnet / 单一网址</text>
    <text class="m" x="60" y="172" font-size="18">Key 存钥匙串 · 300s 去重</text>
    <text class="m" x="60" y="198" font-size="18">离线退避 · 重启不重收</text>
    <text class="m" x="60" y="222" font-size="15">上报 POST /api/v1/ingest（带 Key）</text>
  </g>

  <!-- NAS 边界 -->
  <rect class="zone" x="330" y="36" width="560" height="470" rx="20"/>
  <text class="t" x="356" y="72" font-size="21" font-weight="700">NAS 常驻服务（FastAPI · Docker）</text>
  <text class="m" x="356" y="96" font-size="15">只听局域网 · 配置唯一事实源 config/.env</text>

  <g>
    <rect class="inner" x="354" y="112" width="512" height="66" rx="12"/>
    <text class="t" x="374" y="139" font-size="18" font-weight="600">API 层</text>
    <text class="m" x="374" y="163" font-size="15">/api/v1/ingest · /api/crawl · /api/download · /api/items · /ws</text>

    <rect class="inner" x="354" y="194" width="512" height="66" rx="12"/>
    <text class="t" x="374" y="221" font-size="18" font-weight="600">Ingest 编排</text>
    <text class="m" x="374" y="245" font-size="15">接收磁力 / 网址 · 建任务 · 推送进度</text>

    <rect class="inner" x="354" y="276" width="248" height="86" rx="12"/>
    <text class="t" x="374" y="303" font-size="18" font-weight="600">站点漫游 + 抓取</text>
    <text class="m" x="374" y="327" font-size="15">Scrapling · Chromium</text>
    <text class="m" x="374" y="348" font-size="15">SSRF 准入 · 深度/并发</text>

    <rect class="inner" x="618" y="276" width="248" height="86" rx="12"/>
    <text class="t" x="638" y="303" font-size="18" font-weight="600">本地分类规则链</text>
    <text class="m" x="638" y="327" font-size="15">关键词 → 厂牌 → 回退</text>
    <text class="m" x="638" y="348" font-size="15">无外部 AI · LRU 缓存</text>

    <rect class="inner" x="354" y="378" width="248" height="86" rx="12"/>
    <text class="t" x="374" y="405" font-size="18" font-weight="600">SQLite 资源库</text>
    <text class="m" x="374" y="429" font-size="15">条目状态 · 去重</text>
    <text class="m" x="374" y="450" font-size="15">重启不丢</text>

    <rect class="inner" x="618" y="378" width="248" height="86" rx="12"/>
    <text class="t" x="638" y="405" font-size="18" font-weight="600">qB 客户端 + 同步</text>
    <text class="m" x="638" y="429" font-size="15">Web API v2 · 提交即开下</text>
    <text class="m" x="638" y="450" font-size="15">每 2s 拉状态</text>
  </g>

  <!-- 右侧 -->
  <g>
    <rect class="box" x="916" y="96" width="248" height="128" rx="16"/>
    <text class="t" x="940" y="132" font-size="20" font-weight="700">qBittorrent</text>
    <text class="m" x="940" y="160" font-size="16">下载 / 做种 / 暂停</text>
    <text class="m" x="940" y="186" font-size="16">保存到 NAS 磁盘</text>
    <text class="m" x="940" y="208" font-size="15">点下载后立即开始</text>

    <rect class="box" x="916" y="300" width="248" height="150" rx="16"/>
    <text class="t" x="940" y="336" font-size="20" font-weight="700">网页工作台</text>
    <text class="m" x="940" y="364" font-size="16">资源库 · 任务 · 设置</text>
    <text class="m" x="940" y="390" font-size="16">WebSocket 实时推送</text>
    <text class="m" x="940" y="416" font-size="16">局域网免密钥</text>
    <text class="m" x="940" y="438" font-size="15">跨源降级 · 不存密码</text>
  </g>

  <!-- 网关说明 -->
  <g>
    <rect class="box" x="330" y="546" width="834" height="112" rx="16"/>
    <text class="t" x="356" y="582" font-size="19" font-weight="700">出口策略（网关 / mihomo）</text>
    <text class="m" x="356" y="610" font-size="16">NAS 默认直连；海外站点按「源 IP + 域名」AND 放行，只对 NAS 生效</text>
    <text class="m" x="356" y="636" font-size="16">BT / PT 纯 IP 连接永远命中 DIRECT，绝不走代理流量</text>
  </g>

  <!-- 连线 -->
  <path class="link-a" d="M288 142 H354"/>
  
  <path class="link" d="M610 178 V194"/>
  <path class="link" d="M610 260 V276"/>
  <path class="link" d="M602 362 H618"/>
  <path class="link" d="M478 362 V378"/>
  
  <path class="link" d="M866 150 H916"/>
  <text class="m" x="806" y="143" font-size="14" text-anchor="end">提交即开下</text>

  <path class="link" d="M1040 224 V250 H880 V178" stroke-dasharray="6 5"/>
  <text class="m" x="1032" y="246" font-size="14" text-anchor="end">每 2s 同步</text>

  <path class="link-a" d="M866 330 H916"/>
  <text class="m" x="856" y="322" font-size="14" text-anchor="end">/ws 推送</text>

  <path class="link" d="M916 372 H866" stroke-dasharray="6 5"/>
  <text class="m" x="856" y="366" font-size="14" text-anchor="end">点「下载」</text>
</svg>

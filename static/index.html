<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Magnet Harvester</title>
    <style>
      :root {
        --bg: #dbe5ea;
        --glass: rgba(246, 249, 250, 0.78);
        --glass-strong: rgba(252, 253, 253, 0.9);
        --glass-muted: rgba(232, 238, 241, 0.72);
        --sidebar: rgba(225, 233, 236, 0.84);
        --line: rgba(37, 53, 61, 0.14);
        --line-strong: rgba(37, 53, 61, 0.24);
        --text: #182126;
        --muted: #617078;
        --faint: #87949a;
        --blue: #087aff;
        --blue-strong: #0066d6;
        --green: #1d8b4b;
        --amber: #ad6500;
        --red: #c9323a;
        --purple: #7256a8;
        --shadow:
          0 22px 60px rgba(34, 52, 61, 0.22), 0 2px 8px rgba(34, 52, 61, 0.1);
        --font:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          sans-serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11181c;
          --glass: rgba(25, 33, 38, 0.8);
          --glass-strong: rgba(31, 40, 45, 0.92);
          --glass-muted: rgba(41, 51, 57, 0.76);
          --sidebar: rgba(24, 32, 37, 0.88);
          --line: rgba(227, 238, 243, 0.12);
          --line-strong: rgba(227, 238, 243, 0.22);
          --text: #eef4f6;
          --muted: #a4b1b7;
          --faint: #77868d;
          --blue: #4aa1ff;
          --blue-strong: #66afff;
          --green: #50c878;
          --amber: #f0a447;
          --red: #ff6b71;
          --purple: #ab91df;
          --shadow:
            0 26px 70px rgba(0, 0, 0, 0.42), 0 2px 10px rgba(0, 0, 0, 0.22);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        background: var(--bg);
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--blue) 30%, transparent);
        outline-offset: 1px;
      }
      .app-window {
        width: calc(100vw - 32px);
        height: calc(100vh - 32px);
        margin: 16px;
        display: grid;
        grid-template: 62px minmax(0, 1fr) / 270px minmax(480px, 1fr) 292px;
        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(24px) saturate(120%);
        -webkit-backdrop-filter: blur(24px) saturate(120%);
      }
      .titlebar {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 270px minmax(0, 1fr) 292px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        background: var(--glass-strong);
        user-select: none;
      }
      .title-brand,
      .title-center,
      .title-status {
        min-width: 0;
        display: flex;
        align-items: center;
      }
      .title-brand {
        gap: 12px;
        padding: 0 16px;
      }
      .traffic-lights {
        display: flex;
        gap: 7px;
      }
      .traffic-light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
      }
      .traffic-light.red {
        background: #ff5f57;
      }
      .traffic-light.amber {
        background: #febc2e;
      }
      .traffic-light.green {
        background: #28c840;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        color: white;
        background: #1677d2;
        border: 1px solid rgba(255, 255, 255, 0.34);
        border-radius: 7px;
        box-shadow:
          inset 0 1px rgba(255, 255, 255, 0.22),
          0 2px 6px rgba(0, 74, 147, 0.22);
      }
      .brand-copy {
        min-width: 0;
      }
      .brand-name {
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
      }
      .brand-meta {
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
      }
      .title-center {
        justify-content: center;
        padding: 0 18px;
      }
      .workspace-title {
        font-size: 13px;
        font-weight: 650;
      }
      .workspace-subtitle {
        margin-left: 8px;
        color: var(--muted);
        font-size: 11px;
      }
      .title-status {
        justify-content: flex-end;
        gap: 7px;
        padding: 0 14px;
      }
      .status-chip {
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--glass-muted);
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      button.status-chip {
        cursor: pointer;
      }
      button.status-chip:hover {
        border-color: var(--line-strong);
        background: var(--glass-strong);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
        flex: 0 0 auto;
      }
      .dot.online {
        background: var(--green);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 15%, transparent);
      }
      .dot.offline {
        background: var(--red);
      }
      .dot.checking {
        background: var(--amber);
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .sidebar,
      .inspector,
      .library {
        min-height: 0;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
      }
      .sidebar-scroll,
      .inspector-scroll {
        min-height: 0;
        overflow-y: auto;
      }
      .section {
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      .section-heading {
        margin: 0 0 11px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .field-label {
        display: block;
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 11px;
      }
      .input,
      .select {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        color: var(--text);
        background: var(--glass-strong);
        border: 1px solid var(--line);
        border-radius: 7px;
        outline: none;
      }
      .input::placeholder {
        color: var(--faint);
      }
      .input:focus,
      .select:focus {
        border-color: color-mix(in srgb, var(--blue) 55%, var(--line));
      }
      .field-stack {
        display: grid;
        gap: 10px;
      }
      .option-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .option-copy strong {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }
      .option-copy span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
      }
      .switch {
        position: relative;
        width: 34px;
        height: 20px;
        flex: 0 0 auto;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .switch-track {
        position: absolute;
        inset: 0;
        border-radius: 10px;
        cursor: pointer;
        background: color-mix(in srgb, var(--faint) 38%, transparent);
        transition: background 0.18s ease;
      }
      .switch-track::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        transition: transform 0.18s ease;
      }
      .switch input:checked + .switch-track {
        background: var(--blue);
      }
      .switch input:checked + .switch-track::after {
        transform: translateX(14px);
      }
      .button {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--glass-strong);
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      .button:hover {
        border-color: var(--line-strong);
        background: color-mix(in srgb, var(--glass-strong) 80%, white);
      }
      .button:active {
        transform: translateY(1px);
      }
      .button:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }
      .button.primary {
        color: white;
        background: var(--blue);
        border-color: var(--blue);
      }
      .button.primary:hover {
        background: var(--blue-strong);
      }
      .button.danger {
        color: var(--red);
      }
      .button.full {
        width: 100%;
      }
      .button.icon-only {
        width: 32px;
        padding: 0;
      }
      .button.loading svg {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .stat {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: color-mix(in srgb, var(--glass-strong) 70%, transparent);
      }
      .stat-value {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .stat-label {
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
      }
      .activity {
        min-height: 140px;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 14px 16px;
        overflow: hidden;
      }
      .activity-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .activity-log {
        min-height: 0;
        overflow-y: auto;
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.55;
      }
      .log-line {
        display: grid;
        grid-template-columns: 50px 1fr;
        gap: 7px;
        padding: 3px 0;
      }
      .log-time {
        color: var(--faint);
      }
      .log-msg {
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .log-msg.info {
        color: var(--blue);
      }
      .log-msg.found {
        color: var(--green);
      }
      .log-msg.warn {
        color: var(--amber);
      }
      .log-msg.error {
        color: var(--red);
      }
      .library {
        display: flex;
        flex-direction: column;
        background: var(--glass);
        overflow: hidden;
      }
      .toolbar {
        min-height: 54px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--glass-strong) 72%, transparent);
      }
      .search-wrap {
        position: relative;
        flex: 1 1 220px;
        min-width: 140px;
        max-width: 420px;
      }
      .search-wrap svg {
        position: absolute;
        left: 9px;
        top: 9px;
        width: 15px;
        height: 15px;
        color: var(--faint);
        pointer-events: none;
      }
      .search-input {
        padding-left: 31px;
      }
      .selection-summary {
        margin-left: auto;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .filter-tabs {
        min-height: 42px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
      }
      .filter-tab {
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        white-space: nowrap;
        font-size: 11px;
      }
      .filter-tab:hover {
        background: var(--glass-muted);
        color: var(--text);
      }
      .filter-tab.active {
        color: var(--text);
        background: var(--glass-strong);
        box-shadow: 0 1px 4px rgba(24, 38, 45, 0.12);
      }
      .table-shell {
        min-height: 0;
        flex: 1;
        position: relative;
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        min-width: 720px;
      }
      thead {
        position: sticky;
        top: 0;
        z-index: 2;
      }
      th {
        height: 34px;
        padding: 0 10px;
        color: var(--muted);
        background: var(--glass-strong);
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 10px;
        font-weight: 650;
      }
      td {
        height: 48px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tbody tr {
        transition: background 0.12s ease;
      }
      tbody tr:hover {
        background: color-mix(in srgb, var(--blue) 5%, transparent);
      }
      tbody tr.selected {
        background: color-mix(in srgb, var(--blue) 9%, transparent);
      }
      .checkbox {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--blue);
        cursor: pointer;
      }
      .name-cell {
        max-width: 340px;
      }
      .item-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .item-meta {
        margin-top: 3px;
        color: var(--faint);
        font-family: var(--mono);
        font-size: 9px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 7px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--glass-muted);
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
      }
      .cat-电影,
      .cat-纪录片 {
        color: var(--blue-strong);
        background: color-mix(in srgb, var(--blue) 9%, var(--glass-strong));
      }
      .cat-电视剧,
      .cat-动漫 {
        color: var(--purple);
        background: color-mix(in srgb, var(--purple) 10%, var(--glass-strong));
      }
      .cat-音乐,
      .cat-综艺 {
        color: var(--green);
        background: color-mix(in srgb, var(--green) 9%, var(--glass-strong));
      }
      .cat-游戏 {
        color: var(--red);
        background: color-mix(in srgb, var(--red) 8%, var(--glass-strong));
      }
      .cat-软件 {
        color: var(--amber);
        background: color-mix(in srgb, var(--amber) 8%, var(--glass-strong));
      }
      .status-cell {
        white-space: nowrap;
        font-size: 11px;
      }
      .status-wrap {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
      }
      .status-pending,
      .status-skipped {
        color: var(--muted);
      }
      .status-classifying,
      .status-adding {
        color: var(--amber);
      }
      .status-queued {
        color: var(--blue);
      }
      .status-downloading,
      .status-success {
        color: var(--green);
      }
      .status-error {
        color: var(--red);
      }
      .source-cell {
        max-width: 150px;
        color: var(--muted);
        font-size: 10px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty-state {
        position: absolute;
        inset: 34px 0 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .empty-content {
        max-width: 280px;
        text-align: center;
        color: var(--muted);
      }
      .empty-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
        display: grid;
        place-items: center;
        color: var(--blue);
        background: color-mix(in srgb, var(--blue) 11%, var(--glass-strong));
        border: 1px solid color-mix(in srgb, var(--blue) 18%, var(--line));
        border-radius: 8px;
      }
      .empty-title {
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
      }
      .empty-copy {
        margin-top: 5px;
        font-size: 11px;
        line-height: 1.5;
      }
      .inspector {
        background: var(--sidebar);
        border-left: 1px solid var(--line);
        overflow: hidden;
      }
      .inspector-head {
        min-height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .inspector-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
      }
      .connection-result {
        min-height: 34px;
        display: flex;
        align-items: center;
        margin-top: 10px;
        padding: 7px 9px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--glass-muted);
        font-size: 11px;
      }
      .connection-result.success {
        color: var(--green);
      }
      .connection-result.error {
        color: var(--red);
      }
      .security-note {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.45;
      }
      .mobile-nav {
        display: none;
      }
      .progress-bar {
        position: fixed;
        z-index: 100;
        top: 16px;
        left: 16px;
        width: 0;
        height: 2px;
        background: var(--blue);
        transition: width 0.3s ease;
      }
      .toast-stack {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 200;
        display: grid;
        gap: 8px;
        width: min(340px, calc(100vw - 32px));
      }
      .toast {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 11px 12px;
        color: var(--text);
        background: var(--glass-strong);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(25, 42, 50, 0.2);
        backdrop-filter: blur(20px);
        animation: toast-in 0.2s ease-out;
      }
      .toast.error {
        border-color: color-mix(in srgb, var(--red) 35%, var(--line));
      }
      .toast.success {
        border-color: color-mix(in srgb, var(--green) 35%, var(--line));
      }
      .toast svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        margin-top: 1px;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      dialog {
        width: min(390px, calc(100vw - 32px));
        padding: 0;
        color: var(--text);
        background: var(--glass-strong);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(28px);
      }
      dialog::backdrop {
        background: rgba(12, 20, 24, 0.28);
        backdrop-filter: blur(4px);
      }
      .dialog-body {
        padding: 18px;
      }
      .dialog-title {
        margin: 0;
        font-size: 15px;
      }
      .dialog-copy {
        margin: 7px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
      }
      svg {
        width: 15px;
        height: 15px;
        stroke-width: 2;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--faint) 35%, transparent);
        border: 3px solid transparent;
        background-clip: padding-box;
        border-radius: 7px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      @media (max-width: 1080px) {
        .app-window {
          grid-template-columns: 240px minmax(430px, 1fr);
        }
        .titlebar {
          grid-template-columns: 240px minmax(0, 1fr);
        }
        .title-status {
          padding-right: 12px;
        }
        .inspector {
          display: none;
        }
      }
      @media (max-width: 760px) {
        body {
          overflow: auto;
        }
        .app-window {
          width: 100vw;
          height: 100dvh;
          margin: 0;
          border: 0;
          border-radius: 0;
          grid-template: 58px minmax(0, 1fr) 54px / 1fr;
        }
        .titlebar {
          grid-column: 1;
          grid-template-columns: 1fr auto;
        }
        .title-brand {
          padding-left: 12px;
        }
        .traffic-lights,
        .brand-meta,
        .title-center,
        .status-chip .status-label {
          display: none;
        }
        .title-status {
          padding: 0 10px;
        }
        .status-chip {
          width: 30px;
          justify-content: center;
          padding: 0;
        }
        .sidebar,
        .library,
        .inspector {
          grid-column: 1;

    <script src="/static/lucide.min.js"></script>
    <script>
      const items = new Map();
      const selected = new Set();
      let filter = "all";
      let searchQuery = "";
      let ws = null;
      let reconnectTimer = null;
      let clipRunning = false;
      let clipCount = 0;

      function initIcons() {
        if (window.lucide)
          window.lucide.createIcons({ attrs: { "aria-hidden": "true" } });
      }

      function apiHeaders(extra = {}) {
        const headers = { ...extra };
        const key = sessionStorage.getItem("magnet-api-key") || "";
        if (key) headers["X-API-Key"] = key;
        return headers;
      }

      async function apiFetch(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: apiHeaders(options.headers || {}),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail =
            typeof data.detail === "string"
              ? data.detail
              : Array.isArray(data.detail) && data.detail[0]?.msg
                ? data.detail[0].msg.replace(/^Value error,\s*/, "")
                : `请求失败 (${response.status})`;
          if (response.status === 401) setMobileView("config");
          throw new Error(detail);
        }
        return data;
      }

      function connectWS() {
        clearTimeout(reconnectTimer);
        setWsState("checking", "连接中");
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws`);
        ws.onopen = () => setWsState("online", "已连接");
        ws.onmessage = (event) => {
          try {
            handleMsg(JSON.parse(event.data));
          } catch (error) {
            addLog(`事件解析失败: ${error.message}`, "error");
          }
        };
        ws.onclose = () => {
          setWsState("offline", "重连中");
          reconnectTimer = setTimeout(connectWS, 2000);
        };
        ws.onerror = () => ws.close();
      }

      function setWsState(state, label) {
        document.getElementById("dotWs").className = `dot ${state}`;
        document.getElementById("wsDetailDot").className = `dot ${state}`;
        document.getElementById("wsStatus").textContent = label;
        document.getElementById("wsDetail").textContent = label;
      }

      function handleMsg(msg) {
        switch (msg.type) {
          case "init":
            items.clear();
            selected.clear();
            (msg.items || []).forEach((item) => items.set(item.hash, item));
            renderTable();
            addLog("实时数据已同步", "info");
            break;
          case "crawl_start":
            setProgress(10);
            setCrawling(true);
            addLog(`开始爬取 ${shortUrl(msg.url)}`, "info");
            break;
          case "progress":
            addLog(
              `${msg.msg || "处理中"}${msg.url ? ` · ${shortUrl(msg.url)}` : ""}`
            );
            break;
          case "magnet_found":
            if (msg.item) {
              items.set(msg.item.hash, msg.item);
              renderTable();
              addLog(`发现 ${msg.item.name}`, "found");
            }
            setProgress(Math.min(90, 10 + items.size));
            break;
          case "store_changed":
            if (msg.item) {
              items.set(msg.item.hash, msg.item);
              renderTable();
            }
            break;
          case "classify_start":
            addLog(`正在分类 ${msg.count || 0} 个资源`, "info");
            break;
          case "classify_done":
            if (items.has(msg.hash)) {
              const item = items.get(msg.hash);
              item.category = msg.category;
              item.status = "pending";
              renderTable();
            }
            break;
          case "classify_all_done":
            addLog("分类完成", "found");
            break;
          case "crawl_done":
            setProgress(100);
            setTimeout(() => setProgress(0), 900);
            setCrawling(false);
            addLog(`爬取完成，共 ${msg.total || 0} 个资源`, "found");
            toast("采集任务已完成", "success");
            break;
          case "download_start":
            addLog(
              `发送到 qB · ${(items.get(msg.hash) || {}).name || msg.hash}`,
              "info"
            );
            break;
          case "download_result":
            if (items.has(msg.hash)) {
              const item = items.get(msg.hash);
              item.status = msg.status;
              if (msg.error_msg !== undefined) item.error_msg = msg.error_msg;
              if (msg.progress !== undefined) item.progress = msg.progress;
              if (msg.torrent_state !== undefined)
                item.torrent_state = msg.torrent_state;
              renderTable();
              logDownloadState(item, msg);
            }
            break;
          case "items_cleared":
            items.clear();
            selected.clear();
            renderTable();
            addLog("资源库已清空", "warn");
            break;
          case "error":
            addLog(msg.msg || "发生未知错误", "error");
            toast(msg.msg || "发生未知错误", "error");
            break;
          case "clipboard_status":
            clipCount = msg.magnet_count || clipCount;
            updateClipUI(Boolean(msg.running));
            break;
        }
      }

      async function loadConfig() {
        try {
          const data = await apiFetch("/api/config");
          document.getElementById("cfgHost").value = data.qbit_host || "";
          document.getElementById("cfgUser").value = data.qbit_username || "";
        } catch (error) {
          setConfigResult(error.message, "error");
        }
        const savedKey = sessionStorage.getItem("magnet-api-key") || "";
        document.getElementById("apiKeyInput").value = savedKey;
      }

      async function saveConfig() {
        const button = document.getElementById("saveConfigBtn");
        const key = document.getElementById("apiKeyInput").value.trim();
        if (key) sessionStorage.setItem("magnet-api-key", key);
        else sessionStorage.removeItem("magnet-api-key");
        setButtonBusy(button, true, "连接中");
        try {
          const payload = {
            qbit_host: document.getElementById("cfgHost").value.trim(),
            qbit_username: document.getElementById("cfgUser").value.trim(),
          };
          const password = document.getElementById("cfgPass").value;
          if (password) payload.qbit_password = password;
          const data = await apiFetch("/api/config", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!data.connected) throw new Error("无法连接 qBittorrent");
          setConfigResult("连接成功，配置已生效", "success");
          toast("qBittorrent 连接成功", "success");
          checkStatus();
        } catch (error) {
          setConfigResult(error.message, "error");
          toast(error.message, "error");
        } finally {
          setButtonBusy(button, false);
        }
      }

      function setConfigResult(message, state = "") {
        const result = document.getElementById("cfgResult");
        result.textContent = message;
        result.className = `connection-result ${state}`;
        document.getElementById("configDot").className =
          `dot ${state === "success" ? "online" : state === "error" ? "offline" : "checking"}`;
      }

      async function startCrawl() {
        const url = document.getElementById("urlInput").value.trim();
        if (!url) {
          toast("请输入目标网址", "error");
          document.getElementById("urlInput").focus();
          return;
        }
        try {
          const parsed = new URL(url);
          if (!["http:", "https:"].includes(parsed.protocol)) throw new Error();
        } catch {
          toast("请输入有效的 HTTP 或 HTTPS 网址", "error");
          document.getElementById("urlInput").focus();
          return;
        }
        setCrawling(true);
        try {
          await apiFetch("/api/crawl", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              url,
              depth: Number(document.getElementById("depthSelect").value),
              auto_download: document.getElementById("autoToggle").checked,
            }),
          });
        } catch (error) {
          setCrawling(false);
          addLog(error.message, "error");
          toast(error.message, "error");
        }
      }

      async function downloadSelected() {
        if (!selected.size) return;
        const button = document.getElementById("dlBtn");
        setButtonBusy(button, true, "发送中");
        try {
          await apiFetch("/api/download", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ hashes: [...selected] }),
          });
          addLog(`已提交 ${selected.size} 个下载任务`, "info");
          toast("下载任务已提交", "success");
        } catch (error) {
          toast(error.message, "error");
        } finally {
          setButtonBusy(button, false);
          updateCounts();
        }
      }

      async function reclassifySelected() {
        const hashes = selected.size
          ? [...selected]
          : visibleItems().map((item) => item.hash);
        if (!hashes.length) return;
        const button = document.getElementById("classifyBtn");
        setButtonBusy(button, true, "分类中");
        try {
          await apiFetch("/api/reclassify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ hashes }),
          });
          addLog(`已提交 ${hashes.length} 个分类任务`, "info");
        } catch (error) {
          toast(error.message, "error");
        } finally {
          setButtonBusy(button, false);
        }
      }

      function openClearDialog() {
        document.getElementById("clearDialog").showModal();
      }
      function closeClearDialog() {
        document.getElementById("clearDialog").close();
      }
      async function clearAll() {
        closeClearDialog();
        try {
          await apiFetch("/api/items", { method: "DELETE" });
          items.clear();
          selected.clear();
          renderTable();
          toast("资源库已清空", "success");
        } catch (error) {
          toast(error.message, "error");
        }
      }

      const statusLabels = {
        pending: "等待",
        classifying: "分类中",
        adding: "添加中",
        queued: "队列中",
        downloading: "下载中",
        success: "完成",
        error: "异常",
        skipped: "已跳过",
      };

      function visibleItems() {
        const query = searchQuery.toLocaleLowerCase();
        return [...items.values()].filter((item) => {
          const categoryMatch = filter === "all" || item.category === filter;
          const haystack =
            `${item.name || ""} ${item.category || ""} ${item.source_url || ""}`.toLocaleLowerCase();
          return categoryMatch && (!query || haystack.includes(query));
        });
      }

      function rowHtml(item) {
        const progress = Number(item.progress || 0);
        const status = item.status || "pending";
        const statusText =
          status === "downloading" && progress
            ? `${Math.round(progress)}%`
            : statusLabels[status] || status;
        const statusTitle =
          item.error_msg ||
          `${statusLabels[status] || status}${item.torrent_state ? ` · ${item.torrent_state}` : ""}`;
        return `<tr id="row-${esc(item.hash)}" class="${selected.has(item.hash) ? "selected" : ""}">
    <td><input class="checkbox row-checkbox" type="checkbox" ${selected.has(item.hash) ? "checked" : ""} onchange="toggleRow('${esc(item.hash)}', this.checked)" aria-label="选择 ${esc(item.name)}"></td>
    <td class="name-cell"><div class="item-name" title="${esc(item.name)}">${esc(item.name)}</div><div class="item-meta">${esc(item.hash.slice(0, 16))}…</div></td>
    <td><span class="chip cat-${esc(item.category || "pending")}">${esc(item.category || "待分类")}</span></td>
    <td>${esc(item.size || "—")}</td>
    <td class="status-cell status-${esc(status)}" title="${esc(statusTitle)}"><span class="status-wrap"><span class="status-dot"></span>${esc(statusText)}</span></td>
    <td class="source-cell" title="${esc(item.source_url || "")}">${esc(shortUrl(item.source_url))}</td>
  </tr>`;
      }

      function renderTable() {
        const rows = visibleItems();
        document.getElementById("tbody").innerHTML = rows.map(rowHtml).join("");
        const empty = document.getElementById("emptyState");
        empty.style.display = rows.length ? "none" : "grid";
        document.getElementById("emptyTitle").textContent = items.size
          ? "没有匹配结果"
          : "资源库为空";
        document.getElementById("emptyCopy").textContent = items.size
          ? "调整搜索词或分类筛选后重试。"
          : "从左侧创建采集任务，或开启剪贴板监控。";
        updateCounts();
        initIcons();
      }

      function setFilter(category) {
        filter = category;
        document
          .querySelectorAll(".filter-tab")
          .forEach((tab) =>
            tab.classList.toggle("active", tab.dataset.cat === category)
          );
        renderTable();
      }

      function toggleRow(hash, checked) {
        if (checked) selected.add(hash);
        else selected.delete(hash);
        renderTable();
      }

      function toggleVisible(checked) {
        visibleItems().forEach((item) =>
          checked ? selected.add(item.hash) : selected.delete(item.hash)
        );
        renderTable();
      }

      function selectAllVisible() {
        visibleItems().forEach((item) => selected.add(item.hash));
        renderTable();
      }

      function selectNone() {
        selected.clear();
        renderTable();
      }

      function updateCounts() {
        const values = [...items.values()];
        document.getElementById("totalCount").textContent = values.length;
        document.getElementById("selCount").textContent = selected.size;
        document.getElementById("activeCount").textContent = values.filter(
          (item) => ["adding", "queued", "downloading"].includes(item.status)
        ).length;
        document.getElementById("successCount").textContent = values.filter(
          (item) => item.status === "success"
        ).length;
        document.getElementById("errorCount").textContent = values.filter(
          (item) => item.status === "error"
        ).length;
        document.getElementById("dlBtn").disabled = selected.size === 0;
        const visible = visibleItems();
        const selectedVisible = visible.filter((item) =>
          selected.has(item.hash)
        ).length;
        const header = document.getElementById("headerCheckbox");
        header.checked =
          visible.length > 0 && selectedVisible === visible.length;
        header.indeterminate =
          selectedVisible > 0 && selectedVisible < visible.length;
        document.getElementById("workspaceSubtitle").textContent = values.length
          ? `${values.length} 个资源 · ${selected.size} 个已选`
          : "等待新任务";
      }

      function esc(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function shortUrl(value) {
        if (!value) return "—";
        try {
          const url = new URL(value);
          return `${url.hostname}${url.pathname === "/" ? "" : url.pathname.slice(0, 18)}`;
        } catch {
          return String(value).slice(0, 28);
        }
      }

      function addLog(message, type = "") {
        const box = document.getElementById("logBox");
        const line = document.createElement("div");
        line.className = "log-line";
        const time = document.createElement("span");
        time.className = "log-time";
        time.textContent = new Date().toLocaleTimeString("zh-CN", {
          hour12: false,
        });
        const text = document.createElement("span");
        text.className = `log-msg ${type}`;
        text.textContent = message;
        line.append(time, text);
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
        while (box.children.length > 150) box.firstElementChild.remove();
      }

      function clearLog() {
        document.getElementById("logBox").replaceChildren();
      }

      function logDownloadState(item, msg) {
        const name = item.name || item.hash;
        if (msg.status === "queued") addLog(`已进入 qB 队列 · ${name}`, "info");
        else if (msg.status === "downloading")
          addLog(`下载中 ${Math.round(msg.progress || 0)}% · ${name}`, "found");
        else if (msg.status === "success")
          addLog(`下载完成 · ${name}`, "found");
        else if (msg.status === "error")
          addLog(
            `下载失败 · ${name}${msg.error_msg ? ` · ${msg.error_msg}` : ""}`,
            "error"
          );
      }

      function setButtonBusy(button, busy, label = "") {
        if (!button.dataset.label)
          button.dataset.label =
            button.querySelector("span")?.textContent || "";
        button.disabled = busy;
        button.classList.toggle("loading", busy);
        const icon = button.querySelector("svg");
        if (icon && busy) icon.setAttribute("data-lucide", "loader-circle");
        const span = button.querySelector("span");
        if (span) span.textContent = busy ? label : button.dataset.label;
        if (!busy) initIcons();
      }

      function setCrawling(active) {
        const button = document.getElementById("crawlBtn");
        setButtonBusy(button, active, "爬取中");
      }

      function setProgress(percent) {
        document.getElementById("progressBar").style.width = `${percent}%`;
      }

      async function checkStatus() {
        const dot = document.getElementById("dotQbit");
        try {
          const data = await apiFetch("/api/status");
          const online = data.qbittorrent === "online";
          dot.className = `dot ${online ? "online" : "offline"}`;
          document.getElementById("qbitStatus").textContent = online
            ? "qB 在线"
            : "qB 离线";
          document.getElementById("configDot").className =
            `dot ${online ? "online" : "offline"}`;
        } catch {
          dot.className = "dot offline";
          document.getElementById("qbitStatus").textContent = "qB 离线";
        }
      }

      async function toggleClipboard() {
        const button = document.getElementById("clipButton");
        button.disabled = true;
        try {
          const data = await apiFetch(
            clipRunning ? "/api/clipboard/stop" : "/api/clipboard/start",
            { method: "POST" }
          );
          updateClipUI(Boolean(data.running));
          toast(
            data.running ? "剪贴板监控已开启" : "剪贴板监控已关闭",
            "success"
          );
        } catch (error) {
          toast(error.message, "error");
        } finally {
          button.disabled = false;
        }
      }

      function updateClipUI(running) {
        clipRunning = running;
        const state = running ? "online" : "offline";
        document.getElementById("dotClip").className = `dot ${state}`;
        document.getElementById("clipDetailDot").className = `dot ${state}`;
        document.getElementById("clipStatus").textContent = running
          ? `剪贴板 ${clipCount}`
          : "剪贴板";
        document.getElementById("clipDetail").textContent = running
          ? `已开启 · 捕获 ${clipCount} 个`
          : "已关闭";
      }

      async function initClipStatus() {
        try {
          const data = await apiFetch("/api/clipboard");
          clipCount = data.magnet_count || 0;
          updateClipUI(Boolean(data.running));
        } catch {
          updateClipUI(false);
        }
      }

      function setMobileView(view) {
        document.getElementById("appWindow").dataset.mobileView = view;
        document
          .querySelectorAll(".mobile-nav button")
          .forEach((button) =>
            button.classList.toggle("active", button.dataset.view === view)
          );
      }

      function toast(message, type = "") {
        const stack = document.getElementById("toastStack");
        const node = document.createElement("div");
        node.className = `toast ${type}`;
        const icon = document.createElement("i");
        icon.dataset.lucide =
          type === "error"
            ? "circle-alert"
            : type === "success"
              ? "circle-check"
              : "info";
        const text = document.createElement("span");
        text.textContent = message;
        node.append(icon, text);
        stack.appendChild(node);
        initIcons();
        setTimeout(() => node.remove(), 4200);
      }

      document
        .getElementById("urlInput")
        .addEventListener("keydown", (event) => {
          if (event.key === "Enter") startCrawl();
        });
      document
        .getElementById("searchInput")
        .addEventListener("input", (event) => {
          searchQuery = event.target.value.trim();
          renderTable();
        });
      document
        .getElementById("apiKeyInput")
        .addEventListener("input", (event) => {
          const value = event.target.value.trim();
          if (value) sessionStorage.setItem("magnet-api-key", value);
          else sessionStorage.removeItem("magnet-api-key");
        });
      document.addEventListener("keydown", (event) => {
        if (
          event.key === "/" &&
          !["INPUT", "SELECT", "TEXTAREA"].includes(
            document.activeElement.tagName
          )
        ) {
          event.preventDefault();
          document.getElementById("searchInput").focus();
        }
        if (
          event.key === "Escape" &&
          document.getElementById("clearDialog").open
        )
          closeClearDialog();
      });

      initIcons();
      connectWS();
      loadConfig();
      checkStatus();
      initClipStatus();
      renderTable();
      addLog("工作台已就绪", "info");
      setInterval(checkStatus, 30000);
    </script>
  </body>
</html>

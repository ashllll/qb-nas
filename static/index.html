<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Magnet Harvester</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="progress-bar" id="progressBar"></div>
    <main class="app-window" id="appWindow" data-mobile-view="library">
      <header class="titlebar">
        <div class="title-brand">
          <div class="traffic-lights" aria-hidden="true">
            <span class="traffic-light red"></span
            ><span class="traffic-light amber"></span
            ><span class="traffic-light green"></span>
          </div>
          <div class="brand-mark">
            <svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="mag-bridge" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="var(--pole-north)"/>
                  <stop offset="100%" stop-color="var(--pole-south)"/>
                </linearGradient>
              </defs>
              <path d="M5.5 8C5.5 2.5 22.5 2.5 22.5 8" stroke="url(#mag-bridge)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
              <rect x="3" y="8" width="7" height="16" rx="2.5" fill="var(--pole-north)"/>
              <rect x="18" y="8" width="7" height="16" rx="2.5" fill="var(--pole-south)"/>
            </svg>
          </div>
          <canvas id="fieldCanvas" width="64" height="32" aria-hidden="true"></canvas>
          <div class="brand-copy">
            <div class="brand-name">Magnet Harvester</div>
            <div class="brand-meta">NAS 资源工作台</div>
          </div>
        </div>
        <div class="title-center">
          <span class="workspace-title">资源库</span>
          <span class="workspace-subtitle" id="workspaceSubtitle"
            >等待新任务</span
          >
        </div>
        <div class="title-status">
          <div class="status-chip" title="实时连接状态">
            <span class="dot checking" id="dotWs"></span
            ><span class="status-label" id="wsStatus">连接中</span>
          </div>
          <div class="status-chip" title="qBittorrent 状态">
            <span class="dot checking" id="dotQbit"></span
            ><span class="status-label" id="qbitStatus">检测中</span>
          </div>
          <button
            class="status-chip"
            id="clipButton"
            type="button"
            onclick="toggleClipboard()"
            title="切换剪贴板监控"
          >
            <span class="dot offline" id="dotClip"></span
            ><span class="status-label" id="clipStatus">剪贴板</span>
          </button>
        </div>
      </header>

      <aside class="sidebar">
        <div class="sidebar-scroll">
          <section class="section">
            <h2 class="section-heading">新建采集任务</h2>
            <div class="field-stack">
              <div>
                <label class="field-label" for="urlInput">目标网址</label>
                <input
                  class="input"
                  id="urlInput"
                  type="url"
                  inputmode="url"
                  autocomplete="url"
                  placeholder="https://example.com/torrents"
                />
              </div>
              <div>
                <label class="field-label" for="depthSelect">爬取深度</label>
                <select class="select" id="depthSelect">
                  <option value="1">1 · 当前页面</option>
                  <option value="2">2 · 跟随子链接</option>
                  <option value="3">3 · 递归爬取</option>
                </select>
              </div>
              <div class="option-row">
                <div class="option-copy">
                  <strong>自动下载</strong><span>分类完成后发送到 qB</span>
                </div>
                <label class="switch">
                  <input id="autoToggle" type="checkbox" />
                  <span class="switch-track"></span>
                </label>
              </div>
              <button
                class="button primary full"
                id="crawlBtn"
                type="button"
                onclick="startCrawl()"
              >
                <i data-lucide="play"></i><span>开始爬取</span>
              </button>
            </div>
          </section>
          <section class="section">
            <h2 class="section-heading">任务概览</h2>
            <div class="stats-grid">
              <div class="stat">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">发现资源</div>
              </div>
              <div class="stat">
                <div class="stat-value" id="activeCount">0</div>
                <div class="stat-label">活动下载</div>
              </div>
              <div class="stat">
                <div class="stat-value" id="successCount">0</div>
                <div class="stat-label">已完成</div>
              </div>
              <div class="stat">
                <div class="stat-value" id="errorCount">0</div>
                <div class="stat-label">异常</div>
              </div>
            </div>
          </section>
        </div>
        <section class="activity">
          <div class="activity-head">
            <h2 class="section-heading" style="margin: 0">活动记录</h2>
            <button
              class="button icon-only"
              type="button"
              onclick="clearLog()"
              title="清空活动记录"
              aria-label="清空活动记录"
            >
              <i data-lucide="trash-2"></i>
            </button>
          </div>
          <div class="activity-log" id="logBox" aria-live="polite"></div>
        </section>
      </aside>

      <section class="library">
        <div class="toolbar">
          <div class="search-wrap">
            <i data-lucide="search"></i>
            <input
              class="input search-input"
              id="searchInput"
              type="search"
              placeholder="搜索资源、分类或来源"
            />
          </div>
          <span class="selection-summary"
            >已选 <strong id="selCount">0</strong></span
          >
          <button
            class="button icon-only"
            type="button"
            onclick="selectAllVisible()"
            title="选择当前结果"
            aria-label="选择当前结果"
          >
            <i data-lucide="list-checks"></i>
          </button>
          <button
            class="button icon-only"
            type="button"
            onclick="selectNone()"
            title="取消选择"
            aria-label="取消选择"
          >
            <i data-lucide="square"></i>
          </button>
          <button
            class="button"
            id="classifyBtn"
            type="button"
            onclick="reclassifySelected()"
          >
            <i data-lucide="tags"></i><span>重新分类</span>
          </button>
          <button
            class="button primary"
            id="dlBtn"
            type="button"
            onclick="downloadSelected()"
            disabled
          >
            <i data-lucide="download"></i><span>下载</span>
          </button>
          <button
            class="button danger icon-only"
            type="button"
            onclick="openClearDialog()"
            title="清空资源"
            aria-label="清空资源"
          >
            <i data-lucide="trash-2"></i>
          </button>
        </div>
        <nav class="filter-tabs" aria-label="资源分类">
          <button
            class="filter-tab active"
            data-cat="all"
            type="button"
            onclick="setFilter('all')"
          >
            全部
          </button>
          <button
            class="filter-tab"
            data-cat="电影"
            type="button"
            onclick="setFilter('电影')"
          >
            电影
          </button>
          <button
            class="filter-tab"
            data-cat="电视剧"
            type="button"
            onclick="setFilter('电视剧')"
          >
            电视剧
          </button>
          <button
            class="filter-tab"
            data-cat="动漫"
            type="button"
            onclick="setFilter('动漫')"
          >
            动漫
          </button>
          <button
            class="filter-tab"
            data-cat="音乐"
            type="button"
            onclick="setFilter('音乐')"
          >
            音乐
          </button>
          <button
            class="filter-tab"
            data-cat="游戏"
            type="button"
            onclick="setFilter('游戏')"
          >
            游戏
          </button>
          <button
            class="filter-tab"
            data-cat="软件"
            type="button"
            onclick="setFilter('软件')"
          >
            软件
          </button>
          <button
            class="filter-tab"
            data-cat="综艺"
            type="button"
            onclick="setFilter('综艺')"
          >
            综艺
          </button>
          <button
            class="filter-tab"
            data-cat="纪录片"
            type="button"
            onclick="setFilter('纪录片')"
          >
            纪录片
          </button>
          <button
            class="filter-tab"
            data-cat="其他"
            type="button"
            onclick="setFilter('其他')"
          >
            其他
          </button>
        </nav>
        <div class="table-shell">
          <table>
            <thead>
              <tr>
                <th style="width: 38px">
                  <input
                    class="checkbox"
                    id="headerCheckbox"
                    type="checkbox"
                    onchange="toggleVisible(this.checked)"
                    aria-label="选择当前结果"
                  />
                </th>
                <th>资源名称</th>
                <th style="width: 88px">分类</th>
                <th style="width: 70px">大小</th>
                <th style="width: 118px">状态</th>
                <th style="width: 150px">来源</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty-state" id="emptyState">
            <div class="empty-content">
              <div class="empty-icon"><i data-lucide="inbox"></i></div>
              <div class="empty-title" id="emptyTitle">资源库为空</div>
              <div class="empty-copy" id="emptyCopy">
                从左侧创建采集任务，或开启剪贴板监控。
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="inspector">
        <div class="inspector-head">
          <div class="inspector-title">
            <i data-lucide="settings-2"></i><span>连接设置</span>
          </div>
          <span class="dot checking" id="configDot" title="连接状态"></span>
        </div>
        <div class="inspector-scroll">
          <section class="section">
            <div class="field-stack">
              <div>
                <label class="field-label" for="cfgHost">qBittorrent 地址</label
                ><input
                  class="input"
                  id="cfgHost"
                  type="url"
                  placeholder="http://nas.local:8080"
                />
              </div>
              <div>
                <label class="field-label" for="cfgUser">用户名</label
                ><input
                  class="input"
                  id="cfgUser"
                  autocomplete="username"
                  placeholder="admin"
                />
              </div>
              <div>
                <label class="field-label" for="cfgPass">密码</label
                ><input
                  class="input"
                  id="cfgPass"
                  type="password"
                  autocomplete="current-password"
                  placeholder="保持现有密码"
                />
              </div>
              <button
                class="button primary full"
                id="saveConfigBtn"
                type="button"
                onclick="saveConfig()"
              >
                <i data-lucide="plug-zap"></i><span>保存并测试</span>
              </button>
            </div>
            <div class="connection-result" id="cfgResult">尚未测试连接</div>
          </section>
          <section class="section">
            <h2 class="section-heading">访问安全</h2>
            <label class="field-label" for="apiKeyInput">API Key</label>
            <input
              class="input"
              id="apiKeyInput"
              type="password"
              autocomplete="off"
              placeholder="未配置时留空"
            />
            <p class="security-note">
              密钥仅保存在当前浏览器会话中，用于需要授权的写操作。
            </p>
          </section>
          <section class="section">
            <h2 class="section-heading">运行状态</h2>
            <div class="field-stack">
              <div class="option-row">
                <span class="option-copy"
                  ><strong>本地分类器</strong><span>规则与厂牌识别</span></span
                ><span class="dot online"></span>
              </div>
              <div class="option-row">
                <span class="option-copy"
                  ><strong>实时事件</strong
                  ><span id="wsDetail">正在连接</span></span
                ><span class="dot checking" id="wsDetailDot"></span>
              </div>
              <div class="option-row">
                <span class="option-copy"
                  ><strong>剪贴板</strong
                  ><span id="clipDetail">已关闭</span></span
                ><span class="dot offline" id="clipDetailDot"></span>
              </div>
            </div>
          </section>
        </div>
      </aside>

      <nav class="mobile-nav" aria-label="移动端视图">
        <button
          type="button"
          data-view="control"
          onclick="setMobileView('control')"
        >
          <i data-lucide="radar"></i><span>采集</span>
        </button>
        <button
          class="active"
          type="button"
          data-view="library"
          onclick="setMobileView('library')"
        >
          <i data-lucide="library"></i><span>资源库</span>
        </button>
        <button
          type="button"
          data-view="config"
          onclick="setMobileView('config')"
        >
          <i data-lucide="settings-2"></i><span>设置</span>
        </button>
      </nav>
    </main>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>
    <dialog id="clearDialog">
      <div class="dialog-body">
        <h2 class="dialog-title">清空资源库？</h2>
        <p class="dialog-copy">
          这会移除当前界面中的全部资源记录，但不会删除 qBittorrent
          中已有的任务。
        </p>
      </div>
      <div class="dialog-actions">
        <button class="button" type="button" onclick="closeClearDialog()">
          取消
        </button>
        <button class="button danger" type="button" onclick="clearAll()">
          清空
        </button>
      </div>
    </dialog>

    <script src="/static/app.js"></script>
  </body>
</html>

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnet-harvester"
version = "3.0.0"
description = "磁力链接采集与分类服务 — 自动爬取、AI 分类、NAS 下载"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "scrapling[fetchers]>=0.4.9",
    "playwright>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["magnet_harvester*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["magnet_harvester"]

[tool.coverage.report]
fail_under = 79
show_missing = true
skip_covered = true

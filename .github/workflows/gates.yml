name: gates

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # 项目脚本（scripts/run-python.cjs、npm run check）固定用仓库内 .venv；
      # CI 也建 .venv，保证测试里的启动器用例与本地同构。
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          # requirements.txt holds runtime deps only; the gate tools live in the pyproject dev extra.
          .venv/bin/pip install ruff==0.15.21 pytest pytest-asyncio

      - name: Install Playwright browser
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: ruff check
        run: .venv/bin/ruff check magnet_harvester tests

      - name: ruff format --check
        run: .venv/bin/ruff format --check magnet_harvester tests

      - name: pytest
        run: .venv/bin/python -m pytest tests -q

name: gates

on:
  push:
    branches:
      - main
      - "stage/**"
  pull_request:
    branches:
      - main

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # requirements.txt holds runtime deps only; the gate tools live in the pyproject dev extra.
          pip install ruff==0.15.21 pytest pytest-asyncio

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: ruff check
        run: ruff check magnet_harvester tests

      - name: ruff format --check
        run: ruff format --check magnet_harvester tests

      - name: pytest
        run: python -m pytest tests -q

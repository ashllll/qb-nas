name: auto-merge

# CI 绿后自动合 main：gates 工作流在 pull_request 上成功后，
# 对同一个 PR 做 squash 合并。push 触发的 gates 没有 PR 关联，直接跳过。
# agent 生成的 PR（label=agent 或分支 factory/*）保持 draft，由人审后手动合并。
on:
  workflow_run:
    workflows: ["gates"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Squash-merge the green PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length === 0) {
              core.info('no pull request attached to this run; skip');
              return;
            }
            for (const pr of prs) {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              if (data.state !== 'open' || data.draft) {
                core.info(`PR #${pr.number} is ${data.state}${data.draft ? ' (draft)' : ''}; skip`);
                continue;
              }
              const labels = (data.labels || []).map((label) =>
                typeof label === 'string' ? label : label.name,
              );
              if (labels.includes('agent') || data.head.ref.startsWith('factory/')) {
                core.info(`PR #${pr.number} is agent-generated; skip auto-merge`);
                continue;
              }
              // gates 跑完后 PR 又推了新提交：这次绿灯不代表当前 head，等下一轮 gates。
              if (data.head.sha !== run.head_sha) {
                core.info(`PR #${pr.number} head ${data.head.sha} is newer than tested ${run.head_sha}; skip`);
                continue;
              }
              if (data.mergeable === false) {
                core.warning(`PR #${pr.number} is not mergeable; skip`);
                continue;
              }
              const res = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info(`PR #${pr.number}: ${res.data.merged ? 'merged ' + res.data.sha : 'not merged (' + res.data.message + ')'}`);
            }

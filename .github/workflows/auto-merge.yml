name: auto-merge

# CI 绿后自动合 main：gates 工作流在 pull_request 上成功后，
# 对同一个 PR 做 squash 合并。push 触发的 gates 没有 PR 关联，直接跳过。
on:
  workflow_run:
    workflows: ["gates"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the green PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length === 0) {
              core.info('no pull request attached to this run; skip');
              return;
            }
            for (const pr of prs) {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              if (data.state !== 'open' || data.draft) {
                core.info(`PR #${pr.number} is ${data.state}${data.draft ? ' (draft)' : ''}; skip`);
                continue;
              }
              if (data.mergeable === false) {
                core.warning(`PR #${pr.number} is not mergeable; skip`);
                continue;
              }
              const res = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
              core.info(`PR #${pr.number}: ${res.data.merged ? 'merged ' + res.data.sha : 'not merged (' + res.data.message + ')'}`);
            }
